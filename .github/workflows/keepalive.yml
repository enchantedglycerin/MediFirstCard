name: keepalive

# Render's free instance sleeps after 15 idle minutes and takes 30-60 s to wake, which
# shows up as 10+ second requests in the app. A ping every 10 minutes keeps it warm.
# One always-on service stays inside Render's 750 free instance-hours per month.
# (GitHub may delay scheduled runs by a few minutes; that is fine here.)
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the API
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 https://medifirstcard-api.onrender.com/health || echo 000)
            if [ "$code" = "200" ]; then echo "ok"; exit 0; fi
            echo "attempt $i: HTTP $code"; sleep 20
          done
          exit 1
