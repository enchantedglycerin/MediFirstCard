<text x="124" y="344" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#44474E" text-anchor="start">• Share with a clinician · app PIN / biometrics</text>
<text x="124" y="368" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#44474E" text-anchor="start">• Tokens and PIN in SecureStore</text>
