<text x="124" y="248" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#44474E" text-anchor="start">Expo SDK 57 · React Native · TypeScript · Paper MD3</text>
<text x="124" y="272" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#44474E" text-anchor="start">• Home · Card · Records · More</text>
